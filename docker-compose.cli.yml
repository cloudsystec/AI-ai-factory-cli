# docker compose -f docker-compose.cli.yml --profile daniel up -d
# Com redis-stack (N8N): use também deploy/n8n-docker-compose.ai-factory.yml na pasta N8N
services:
  cli-tenant-daniel:
    profiles: [daniel]
    build: .
    image: ai-factory-cli:latest
    env_file: data/tenants/a1111111-1111-4111-8111-111111111111/.env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis-stack:6379}
      BACK_URL: ${BACK_URL:-http://host.docker.internal:4000}
      LUNA_BASE_URL: ${LUNA_BASE_URL:-http://ai-factory-luna:8000}
      AI_FACTORY_LOG_COLOR: "1"
      AI_FACTORY_LOG_LEVEL: ${AI_FACTORY_LOG_LEVEL:-debug}
      GIT_AUTHOR_NAME: "Factory Agent"
      GIT_AUTHOR_EMAIL: "agent@factory.local"
      GIT_COMMITTER_NAME: "Factory Agent"
      GIT_COMMITTER_EMAIL: "agent@factory.local"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ./data/tenants/a1111111-1111-4111-8111-111111111111:/app/data/tenants/a1111111-1111-4111-8111-111111111111
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - n8n-network
      - ai-factory-net

networks:
  ai-factory-net:
    external: true
  n8n-network:
    external: true
    name: n8n-network
